<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>manga-on!</title>
    <link rel="stylesheet" href="/manga/manga.css">
    <script src="/manga/manga.js"></script>
</head>
<body>
    <!-- 📚 SECCIÓN MANGA -->
<section class="manga-section">
    <h2>Manga K-ON!</h2>

    <!-- 🧱 Grid de tomos -->
    <div class="manga-grid">

        <!-- 📘 Cada tarjeta representa un tomo -->
        <div class="manga-card" onclick="abrirPDF('https://drive.google.com/file/d/1nbm7zkU3nn102VBGIPFcXWm69dVj2Yt9')">
            <img src="img/tomo1.jpg" alt="Tomo 1">
            <p>Tomo 1</p>
        </div>

        <div class="manga-card" onclick="abrirPDF('manga/tomo2.pdf')">
            <img src="img/tomo2.jpg" alt="Tomo 2">
            <p>Tomo 2</p>
        </div>

        <!-- 👉 repite hasta el tomo 6 -->
        
    </div>
</section>

<!-- 🪟 MODAL (visor del manga) -->
<div id="visorModal" class="modal">
    <div class="modal-content">

        <!-- ❌ Botón cerrar -->
        <span class="cerrar" onclick="cerrarPDF()">✕</span>

        <!-- 📄 Contenedor del PDF -->
        <canvas id="pdf-render"></canvas>

        <!-- 🎮 Controles -->
        <div class="controles">
            <button onclick="paginaAnterior()">⬅</button>
            <span id="pagina-info"></span>
            <button onclick="paginaSiguiente()">➡</button>
        </div>

    </div>
</div>
    
</body>
</html>
